[package]
name = "cut"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Local audio splitter & converter with a bundled ffmpeg"
license = "MIT OR Apache-2.0"

[dependencies]
gpui-kit = "0.7.1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 只为 scheduler 里后台线程 → 前台泵的 channel。gpui 自己就依赖 smol 2.0.2，
# 所以这一行不带来任何新的编译量，别换成 std::sync::mpsc：那个 recv 会把执行器线程堵死。
smol = "2"

# 只在 Windows 上用，且只为 `--ffmpeg-env` 把 stdout/stderr 接回父进程控制台——AttachConsole
# + SetStdHandle + CreateFileW("CONOUT$")。用例：release 包里 `windows_subsystem = "windows"`
# 启动的 GUI 子系统进程没有控制台，println! 默认哪儿都不去；CI 自检要把诊断输出重定向到
# 文件，没这一套 PowerShell 的 `> $log` 抓不到东西。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }

# gpui-kit 官方推荐的开发期运行时性能覆盖（只改善运行速度，不改善编译速度）
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
