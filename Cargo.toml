[package]
name = "cut"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Local audio splitter & converter with a bundled ffmpeg"
license = "MIT OR Apache-2.0"

[dependencies]
gpui-kit = "0.7.1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 只为 scheduler 里后台线程 → 前台泵的 channel。gpui 自己就依赖 smol 2.0.2，
# 所以这一行不带来任何新的编译量，别换成 std::sync::mpsc：那个 recv 会把执行器线程堵死。
smol = "2"

# 只在 Windows 上用，且只为 `--ffmpeg-env` 让 release 包接回父进程控制台——GUI 子系统
# 进程启动时没分配控制台，AttachConsole(ATTACH_PARENT_PROCESS) 把我们接回 PowerShell /
# cmd 的控制台。但 **不要** SetStdHandle 替换 std 句柄——父进程 `>` 重定向时子进程 inherit
# 的是 pipe 句柄（指向文件），把它换成 CONOUT\$ 会让重定向失效。CI 自检靠 `> $log` 拿
# `--ffmpeg-env` 输出，没 AttachConsole PowerShell `>` 抓不到东西。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
] }

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }

# gpui-kit 官方推荐的开发期运行时性能覆盖（只改善运行速度，不改善编译速度）
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
