name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_OPT_LEVEL: 3

jobs:
  # macOS 构建 + 打包
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos"

      - name: Cache ffmpeg vendor
        id: cache-ffmpeg-macos
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg-slim/aarch64-macos
          key: ffmpeg-macos-arm64-v1-${{ hashFiles('script/build-ffmpeg.sh', 'script/ffmpeg-sources.txt') }}

      - name: Build ffmpeg (macOS)
        if: steps.cache-ffmpeg-macos.outputs.cache-hit != 'true'
        run: script/build-ffmpeg.sh

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test --lib

      - name: cargo build --release
        run: cargo build --release

      - name: Build app bundle
        run: script/bundle-macos.sh --skip-build --no-launch

      - name: Upload Cut.app
        uses: actions/upload-artifact@v4
        with:
          name: Cut-macOS
          path: dist/Cut.app

  # Windows 构建 + 打包
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-diffutils
            tar

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows"

      - name: Cache ffmpeg vendor
        id: cache-ffmpeg-windows
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg-slim/x86_64-windows
          key: ffmpeg-windows-x64-v1-${{ hashFiles('script/build-ffmpeg-windows.sh', 'script/ffmpeg-sources.txt') }}

      - name: Build ffmpeg (Windows)
        if: steps.cache-ffmpeg-windows.outputs.cache-hit != 'true'
        run: script/build-ffmpeg-windows.sh --native

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test --lib

      - name: cargo build --release
        shell: pwsh
        run: cargo build --release

      - name: Build release bundle
        shell: pwsh
        run: .\script\bundle-windows.ps1 -SkipBuild -NoLaunch

      - name: Upload Cut-windows
        uses: actions/upload-artifact@v4
        with:
          name: Cut-Windows
          path: dist/Cut-windows
